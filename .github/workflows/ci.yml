name: CI

on:
  push:
    branches: [main, security/post-audit-remediation]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
        env:
          POSTGRES_USER: omnis
          POSTGRES_PASSWORD: omnis_test_password
          POSTGRES_DB: omnis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omnis -d omnis_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      OMNIS_TEST_ADMIN_DATABASE_URL: postgresql://omnis:omnis_test_password@127.0.0.1:5432/omnis_test
      OMNIS_TEST_MIGRATION_DATABASE_URL: postgresql://omnis_migrator:omnis_migration_test_password_2026@127.0.0.1:5432/omnis_test
      OMNIS_TEST_DATABASE_URL: postgresql://omnis_runtime:omnis_runtime_test_password_2026@127.0.0.1:5432/omnis_test
      OMNIS_SANDBOX_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.16.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: docker pull node@sha256:8a32c8cf649a49915a66e81e7a609223c708d0adabf288ee3f4077d765542f85
      - run: pnpm install --frozen-lockfile
      - name: Provision restricted PostgreSQL roles
        run: node --experimental-strip-types packages/db/src/provision.ts
        env:
          OMNIS_ADMIN_DATABASE_URL: postgresql://omnis:omnis_test_password@127.0.0.1:5432/omnis_test
          OMNIS_MIGRATION_DB_PASSWORD: omnis_migration_test_password_2026
          OMNIS_RUNTIME_DB_PASSWORD: omnis_runtime_test_password_2026
      - run: pnpm check
      - run: pnpm build
      - run: pnpm integration:recovery
