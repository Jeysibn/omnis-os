name: Temporary Node release authentication
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: temporary-node-release-authentication
  cancel-in-progress: false
jobs:
  authenticate:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/temporary-node-release-verification'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Authenticate public release without executing Node
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/env -i PATH=/usr/bin:/bin LANG=C.UTF-8 LC_ALL=C.UTF-8 /usr/bin/python3 -I -B - <<'PY'
          import hashlib, json, os, pathlib, subprocess, tarfile, tempfile, urllib.request
          FPR = '5BE8A3F6C8A5C01D106C0AD820B1A390B168D356'
          KEY_REV = '481637f813e912c4aa3622d7964ab426c97b8e8d'
          NAME = 'node-v24.22.1-linux-x64.tar.xz'
          EXPECTED_ARCHIVE = '6c172a9ab6718f7b801fb5a7bd486af2ee5e32758086a04b84fcce2aa77095e6'
          EXPECTED_BINARY = 'e32e2d16081cf644f88392934288086e7662529d0d43277c34f7aad2207cfafb'
          BASE = 'https://nodejs.org/dist/v24.22.1/'
          stage = 'setup'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  raise ValueError('redirect rejected')
          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}), NoRedirect())
          def fetch(url, destination, limit):
              with opener.open(url, timeout=30) as response:
                  if response.status != 200 or response.url != url:
                      raise ValueError('unexpected response')
                  total = 0
                  with destination.open('xb') as output:
                      os.chmod(destination, 0o600)
                      while True:
                          chunk = response.read(65536)
                          if not chunk:
                              break
                          total += len(chunk)
                          if total > limit:
                              raise ValueError('download size exceeded')
                          output.write(chunk)
          def digest(path):
              with path.open('rb') as source:
                  return hashlib.file_digest(source, 'sha256').hexdigest()
          try:
              # Only this disposable hosted-runner directory receives public files.
              root = pathlib.Path(tempfile.mkdtemp(prefix='omnis-node-public-'))
              os.chmod(root, 0o700)
              home = root / 'gnupg'
              home.mkdir(mode=0o700)
              env = {'PATH': '/usr/bin:/bin', 'HOME': str(root), 'GNUPGHOME': str(home),
                     'LANG': 'C.UTF-8', 'LC_ALL': 'C.UTF-8'}
              def command(args):
                  return subprocess.run(args, check=True, capture_output=True, text=True,
                                        env=env, timeout=30).stdout
              stage = 'public-key'
              key = root / 'release-key.asc'
              fetch('https://raw.githubusercontent.com/nodejs/release-keys/' + KEY_REV + '/keys/' + FPR + '.asc', key, 262144)
              metadata = command(['/usr/bin/gpg', '--batch', '--no-options', '--with-colons',
                                  '--import-options', 'show-only', '--import', str(key)])
              lines = metadata.splitlines()
              primary = []
              for index, line in enumerate(lines):
                  if line.startswith('pub:'):
                      primary.append(lines[index + 1].split(':')[9])
              if primary != [FPR]:
                  raise ValueError('unexpected primary key')
              command(['/usr/bin/gpg', '--batch', '--no-options', '--import', str(key)])
              keyring = home / 'pubring.kbx'
              stage = 'manifest-download'
              manifest, signature = root / 'SHASUMS256.txt', root / 'SHASUMS256.txt.sig'
              fetch(BASE + manifest.name, manifest, 1048576)
              fetch(BASE + signature.name, signature, 262144)
              stage = 'manifest-signature'
              status = command(['/usr/bin/gpgv', '--status-fd', '1', '--keyring', str(keyring),
                                str(signature), str(manifest)])
              valid = [line.split() for line in status.splitlines() if line.startswith('[GNUPG:] VALIDSIG ')]
              if len(valid) != 1 or FPR not in (valid[0][2], valid[0][-1]):
                  raise ValueError('unapproved signer')
              stage = 'manifest-entry'
              matches = []
              for line in manifest.read_text(encoding='ascii').splitlines():
                  fields = line.split()
                  if len(fields) == 2 and fields[1] == NAME:
                      matches.append(fields[0])
              if matches != [EXPECTED_ARCHIVE]:
                  raise ValueError('archive checksum mismatch')
              stage = 'archive-download'
              archive = root / NAME
              fetch(BASE + NAME, archive, 134217728)
              stage = 'archive-digest'
              archive_hash = digest(archive)
              if archive_hash != matches[0]:
                  raise ValueError('archive integrity failed')
              stage = 'archive-member'
              member_name = 'node-v24.22.1-linux-x64/bin/node'
              binary = root / 'verified-node.data'
              found = 0
              with tarfile.open(archive, 'r:xz') as package:
                  for index, member in enumerate(package):
                      if index >= 100000 or member.size > 1073741824:
                          raise ValueError('archive bounds exceeded')
                      path = pathlib.PurePosixPath(member.name)
                      if path.is_absolute() or '..' in path.parts or not path.parts or path.parts[0] != 'node-v24.22.1-linux-x64':
                          raise ValueError('unexpected archive path')
                      if member.name != member_name:
                          continue
                      found += 1
                      if found != 1 or not member.isfile() or not 1000000 <= member.size <= 209715200:
                          raise ValueError('unexpected binary member')
                      source = package.extractfile(member)
                      with binary.open('xb') as output:
                          os.chmod(binary, 0o600)
                          remaining = member.size
                          while remaining:
                              chunk = source.read(min(65536, remaining))
                              if not chunk:
                                  raise ValueError('truncated member')
                              output.write(chunk)
                              remaining -= len(chunk)
              if found != 1:
                  raise ValueError('binary missing')
              stage = 'comparison'
              binary_hash = digest(binary)
              verdict = 'MATCH' if binary_hash == EXPECTED_BINARY else 'MISMATCH'
              print(json.dumps({'verdict': verdict, 'runner': 'github-hosted ubuntu-24.04',
                                'signer_primary_fingerprint': FPR,
                                'signing_fingerprint': valid[0][2], 'key_repository_revision': KEY_REV,
                                'manifest_signature': 'VERIFIED', 'archive_sha256': archive_hash,
                                'extracted_bin_node_sha256': binary_hash,
                                'owner_reported_sha256': EXPECTED_BINARY}, sort_keys=True))
          except Exception:
              print(json.dumps({'verdict': 'INCONCLUSIVE', 'failed_stage': stage}))
              raise SystemExit(1)
          PY
