name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: omnis
          POSTGRES_PASSWORD: omnis_test_password
          POSTGRES_DB: omnis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omnis -d omnis_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      OMNIS_TEST_DATABASE_URL: postgresql://omnis:omnis_test_password@127.0.0.1:5432/omnis_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: pnpm integration:mock
