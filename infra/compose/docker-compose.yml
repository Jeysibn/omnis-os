name: omnis-os

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: omnis
      POSTGRES_USER: omnis
      POSTGRES_PASSWORD: ${OMNIS_DB_PASSWORD:?Create local secrets with pnpm configure:owner}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - omnis-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U omnis -d omnis']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

volumes:
  omnis-postgres-data:
